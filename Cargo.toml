[package]
name = "desktop-pet-chatgpt"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
default-run = "desktop-pet-chatgpt"

[features]
p1b-reference = []

[dependencies]
bcdec_rs = "=0.2.0"
png = "=0.18.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
toml_edit = { version = "=0.25.19", features = ["serde"] }
pollster = "=0.4.0"
winit = { version = "=0.30.12", default-features = false, features = [
    "rwh_06",
] }
wgpu = { version = "=27.0.1", default-features = false, features = [
    "std",
    "dx12",
    "wgsl",
] }
egui = { version = "=0.33.3", features = ["default_fonts"] }
egui-winit = { version = "=0.33.3", default-features = false, features = [
    "clipboard",
] }
egui-wgpu = { version = "=0.33.3", default-features = false, features = [
    "winit",
] }
windows = { version = "=0.58.0", features = [
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Gdi",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
